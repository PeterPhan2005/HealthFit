server.port=8082
spring.application.name=user-service

# Database Configuration (User Service DB)
spring.datasource.url=jdbc:postgresql://localhost:5434/user_db
spring.datasource.username=user_user
spring.datasource.password=user_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (same as auth-service for token validation)
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000

# JWT Cookie Configuration
jwt.cookie.enabled=true
jwt.cookie.max-age=86400

# Logging
logging.level.com.healthfit.user=DEBUG
logging.level.org.springframework.security=DEBUG
