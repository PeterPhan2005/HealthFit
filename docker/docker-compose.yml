version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: healthfit-postgres
    environment:
      POSTGRES_DB: healthfit_db
      POSTGRES_USER: healthfit_user
      POSTGRES_PASSWORD: healthfit_pass
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - healthfit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthfit_user -d healthfit_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  healthfit-network:
    driver: bridge
