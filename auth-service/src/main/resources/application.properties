server.port=8081
spring.application.name=auth-service

# Database Configuration (Auth Service DB)
spring.datasource.url=jdbc:postgresql://localhost:5433/auth_db
spring.datasource.username=auth_user
spring.datasource.password=auth_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000
# 24 hours in milliseconds

# JWT Cookie Configuration (for web browsers)
# Set to true to enable HttpOnly cookie support (recommended for web apps)
# Set to false to use Authorization header only (recommended for mobile apps)
jwt.cookie.enabled=true
jwt.cookie.max-age=86400
# Cookie max age in seconds (24 hours)

# Logging
logging.level.com.healthfit.auth=DEBUG
logging.level.org.springframework.security=DEBUG

