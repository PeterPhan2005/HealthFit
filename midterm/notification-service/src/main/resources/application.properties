# Server Configuration
server.port=8086
spring.application.name=notification-service

# ============================================
# RabbitMQ Configuration - QUAN TRỌNG!
# ============================================
# Connection details
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123

# Queue names
rabbitmq.queue.payment=payment.completed
rabbitmq.exchange.payment=payment.exchange
rabbitmq.routing.key.payment=payment.completed

# Retry configuration (nếu RabbitMQ down)
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=3000
spring.rabbitmq.listener.simple.retry.max-attempts=3

# ============================================
# Email Configuration - Gmail SMTP
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=lananhoutlier@gmail.com
spring.mail.password=avnszmemzhttknau

# SMTP properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email settings
notification.email.from=iBanking Support <lananhoutlier@gmail.com>
notification.email.enabled=true

# ============================================
# Actuator
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ============================================
# Logging
# ============================================
logging.level.com.soa.notification=DEBUG
logging.level.org.springframework.amqp=DEBUG
