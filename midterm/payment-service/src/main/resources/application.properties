spring.application.name=payment-service

# Server Configuration
server.port=8084

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5436/payment_db
spring.datasource.username=postgres
spring.datasource.password=sa123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# JWT Configuration (same as AUTH-SERVICE for validation)
spring.app.jwtSecret=mySecretKey123912738aopsgjnspkmndfsopkvajoirjg94gf2opfng2moknm
spring.app.jwtExpirationMs=86400000

# Security Logging
logging.level.org.springframework.security=INFO
logging.level.com.soa.payment.security=DEBUG

# Actuator endpoints for health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# OpenFeign Configuration - URLs of other services
customer-service.url=${CUSTOMER_SERVICE_URL:http://localhost:8082}
student-service.url=${STUDENT_SERVICE_URL:http://localhost:8083}
otp.service.url=${OTP_SERVICE_URL:http://localhost:8085}

# OpenFeign Timeout Configuration
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000

# OpenFeign Logging (for debugging)
logging.level.com.soa.payment.client=DEBUG

# ============================================
# Spring Cloud Configuration
# ============================================
spring.cloud.compatibility-verifier.enabled=false

# ============================================
# RabbitMQ Configuration
# ============================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123

# Queue and Exchange names
rabbitmq.queue.payment=payment.completed
rabbitmq.exchange.payment=payment.exchange
rabbitmq.routing.key.payment=payment.completed
