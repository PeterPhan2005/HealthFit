# Server Configuration
spring.application.name=api-gateway
server.port=8080

# JWT Configuration (must match Auth Service secret)
jwt.secret=aGVhbHRoZml0LXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5nLXRoaXMtaXMtYS1sb25nLXNlY3JldC1rZXktdG8tZW5zdXJlLXNlY3VyaXR5

# Service URLs
services.auth-service.url=http://localhost:8081
services.user-service.url=http://localhost:8082

# Logging
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.healthfit.gateway=DEBUG

# Gateway Routes Configuration
# Auth Service Routes (port 8081)
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=PreserveHostHeader

# User Service Routes (port 8082)
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[1].filters[0]=PreserveHostHeader

# CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true
